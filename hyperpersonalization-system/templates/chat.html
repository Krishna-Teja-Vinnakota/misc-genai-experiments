        .logout-btn:hover {

        }

            min-width: 0;

            box-sizing: border-box;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;

            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-icon {

            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            font-size: 1.1rem;
        }

        .search-controls {
            display: flex;

            align-items: center;
            justify-content: flex-end;
            flex-shrink: 0;
        }

        .search-bar-wrapper {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: 100%;
        }

        .search-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0 1.5rem;
            border-radius: 12px;

            align-items: center;
            gap: 0.5rem;

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .search-btn:active {
            transform: translateY(0);
        }

            0% {
                box-shadow: 0 4px 20px rgba(255, 107, 107, 0.3);

                box-shadow: 0 8px 30px rgba(255, 107, 107, 0.5);

            content: "🎉";
            position: absolute;
            top: 1rem;
            right: 1rem;

            animation: float 6s ease-in-out infinite;

        @keyframes float {

            0%,

                transform: rotate(15deg) translateY(0px);

            50% {
                transform: rotate(15deg) translateY(-10px);

        @keyframes pulse {

                transform: scale(1.05);
            }
        }

        /* Email Sent Confirmation Styles */
        .email-confirmation {
            background: linear-gradient(135deg, #dcfce7 0%, #f0fdf4 100%);
            border: 2px solid #22c55e;
            border-radius: 16px;
            padding: 2rem;
            margin: 2rem 0;
            text-align: center;
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.2);
            animation: emailSentPulse 2s ease-in-out;
            position: relative;
            overflow: hidden;
        }

        .email-confirmation::before {
            content: "✉️📧🎉";
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 4rem;
            opacity: 0.1;
            animation: emailFloat 3s ease-in-out infinite;
        }

        @keyframes emailSentPulse {
            0% {
                transform: scale(0.95);
                opacity: 0;
            }

            50% {
                transform: scale(1.02);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes emailFloat {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .email-confirmation-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #22c55e;
            animation: emailBounce 1s ease-in-out;
        }

        @keyframes emailBounce {

            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-10px);
            }

            60% {
                transform: translateY(-5px);
            }
        }

        .email-confirmation-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #166534;
            margin-bottom: 0.5rem;
        }

        .email-confirmation-message {
            font-size: 1.1rem;
            color: #15803d;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .email-confirmation-details {
            background: rgba(34, 197, 94, 0.1);
            border-radius: 8px;
            padding: 1rem;
            margin: 1rem 0;
            font-size: 0.9rem;
            color: #166534;
        }

        .email-confirmation-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        .email-action-btn {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .email-action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }

        .email-action-btn.secondary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .email-action-btn.secondary:hover {
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .email-confirmation {
                padding: 1.5rem;
                margin: 1rem 0;
            }

            .email-confirmation-title {
                font-size: 1.5rem;
            }

            .email-confirmation-message {
                font-size: 1rem;
            }

            .email-confirmation-actions {
                flex-direction: column;
                align-items: center;
            }

            .email-action-btn {
                width: 100%;
                max-width: 250px;
            }
        }
    </style>
</head>

            <div class="section-header">

    <script>
        // Global variables
        let currentQuery = '';
        let currentProducts = [];
        let currentPersonalizedProducts = [];
        let currentStaticProducts = [];
        let currentOtherUsersProducts = [];
        let dashboardData = null;
        let activeCategory = null;
        let activeSubcategory = null;
        let cartItems = [];
        let cartOpen = false;
        let dashboardMode = true; // Start in dashboard mode

        // Enhanced user interaction tracking
        let userInteractions = {
            liked: new Set(),
            cart: new Set(),
            disliked: new Set()
        };

        // Get user preferences from backend template
        let selectedCategories = [];
        let selectedSubcategories = [];
        let onboardingSkipped = false;

        try {
            // Parse user state from template if available
            selectedCategories = JSON.parse('{{ user_state.selected_categories | tojson | safe }}' || '[]');
            selectedSubcategories = JSON.parse('{{ user_state.selected_subcategories | tojson | safe }}' || '[]');
            onboardingSkipped = Boolean('{{ onboarding_skipped }}' === 'True');
        } catch (e) {
            console.error('Error parsing preferences from backend:', e);
            selectedCategories = [];
            selectedSubcategories = [];
            onboardingSkipped = false;
        }

        console.log('🎯 Dashboard initialized with user preferences:', { selectedCategories, selectedSubcategories, onboardingSkipped });

        // =================== DIRECT IMAGE LOADING SYSTEM ===================

        function getDirectImageUrl(imageUrl) {
            // DIRECT processing - no fallbacks
            if (!imageUrl) return null;

            if (imageUrl.startsWith('http')) return imageUrl;

            const cleanUrl = imageUrl.replace(/^\/+/, '');
            return cleanUrl ? `https://s7d9.scene7.com/is/image/dollargeneral/${cleanUrl}` : null;
        }

        function setupDirectImageLoading(img, imageUrl, productName = 'Product') {
            // SIMPLIFIED: Direct image loading
            const directUrl = getDirectImageUrl(imageUrl);

            if (directUrl) {
                img.src = directUrl;
                img.onerror = function () {
                    // Only fallback is empty placeholder
                    this.src = `https://via.placeholder.com/200x120/f8f9fa/667eea?text=${encodeURIComponent(productName.substring(0, 10))}`;
                };
            } else {
                // No URL provided
                img.src = `https://via.placeholder.com/200x120/f8f9fa/667eea?text=${encodeURIComponent(productName.substring(0, 10))}`;
            }
        }

        // =================== NEW: BIRTHDAY CELEBRATION RENDERING ===================

        function renderBirthdayCelebrationSection(sectionData) {
            const birthdayData = sectionData.birthday_data;

            return `
                <div class="dashboard-section birthday-celebration">
                    <div class="section-header">
                        <div>
                            <div class="section-title">
                                <span class="section-icon" style="font-size: 2rem;"></span> 
                                <h2>${birthdayData.celebration_message}</h2>
                            </div>
                            <p class="section-subtitle">${birthdayData.celebration_subtitle}</p>
                            <div class="section-description">
                                ${birthdayData.is_birthday_today ? ' Today is your special day! Enjoy these exclusive birthday offers!' : ' Your birthday week celebration continues with special offers!'}
                            </div>
                        </div>
                        <div class="section-stats">
                            
                        </div>
                    </div>
                    
                    <div class="birthday-offers-grid">
                        ${birthdayData.offers.map(offer => `
                            <div class="birthday-offer-card" data-product-id="${offer.product._id}">
                                <div class="birthday-special-badge">🎂 Birthday Special</div>
                                
                                <img class="birthday-offer-image" 
                                     src="" 
                                     alt="${offer.product.name}" 
                                     data-image-url="${offer.product.image || ''}"
                                     data-product-name="${offer.product.name}"
                                     onerror="this.src='https://via.placeholder.com/140x140/f8f9fa/667eea?text=Gift'">
                                
                                <div class="birthday-offer-name">${offer.product.name}</div>
                                
                                <div class="birthday-offer-prices">
                                    <span class="original-price">${offer.original_price}</span>
                                    <span class="discount-price">${offer.discounted_price}</span>
                                    <span class="birthday-discount-badge">${offer.discount_percentage}% OFF</span>
                                </div>
                                
                                <div class="birthday-offer-description">${offer.offer_description}</div>
                                
                                <div class="birthday-offer-actions">
                                    <button class="birthday-offer-btn birthday-love-btn" onclick="toggleLike('${offer.product._id}', this)" title="Love this gift!">
                                        ❤️ Love It
                                    </button>
                                    <button class="birthday-offer-btn birthday-cart-btn" onclick="addToCart('${offer.product._id}', this, '${offer.product.name}')" title="Add to cart">
                                        🛒 Add to Cart
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="birthday-week-info">
                        <div class="birthday-week-title">
                            🎈 Birthday Week Special: Valid until ${birthdayData.birthday_week_end || 'soon'}
                        </div>
                        <div class="birthday-week-subtitle">
                            
                        </div>
                    </div>
                </div>
            `;
        }

        // =================== ENHANCED EVENTS RENDERING ===================

        function renderEventsSection(sectionData) {
            const container = document.getElementById('current-events-section');
            if (!sectionData || !sectionData.events || sectionData.events.length === 0) {
                container.classList.add('hidden');
                return;
            }

            document.getElementById('events-title').textContent = sectionData.title || 'Current Offers & Events';
            document.getElementById('events-subtitle').textContent = sectionData.subtitle || '';
            document.getElementById('events-description').textContent = sectionData.description || '';

            const eventsList = document.getElementById('events-list');
            eventsList.innerHTML = ''; // Clear existing content

            sectionData.events.forEach(event => {
                const eventCard = document.createElement('div');
                eventCard.className = 'event-card';

                let eventHTML = '';

                // Event banner
                if (event.banner_image_url) {
                    eventHTML += `<img src="${event.banner_image_url}" class="event-banner" alt="${event.event_name}" onerror="this.style.display='none'">`;
                }

                // Event name and description
                eventHTML += `
                    <h3 class="event-name">${event.event_name}</h3>
                    <p class="event-description">${event.event_description}</p>
                    <div class="offer-product-grid">
                `;

                // Render offers
                event.offers.forEach(offer => {
                    const product = offer.product;
                    const matchesPreferences = offer.matches_preferences;

                    eventHTML += `
                        <div class="offer-product-card ${matchesPreferences ? 'matches-pref' : ''}" data-product-id="${product._id}">
                            <img src="" 
                                 alt="${product.name}" 
                                 data-image-url="${product.image || ''}"
                                 data-product-name="${product.name}"
                                 onerror="this.src='https://via.placeholder.com/80x80/f8f9fa/667eea?text=Item'">
                            
                            <div class="offer-product-name">${product.name}</div>
                            
                            <div class="offer-prices">
                                <span class="original-price">$${offer.original_price}</span>
                                <span class="discount-price">$${offer.discounted_price}</span>
                                <span class="discount-badge">${offer.discount_percentage}% OFF</span>
                            </div>
                            
                            <div class="offer-description">${offer.offer_description}</div>
                            
                            <div class="offer-actions">
                                <button class="offer-btn like-offer-btn" onclick="toggleLike('${product._id}', this)" title="Like">
                                    ❤️
                                </button>
                                <button class="offer-btn cart-offer-btn" onclick="addToCart('${product._id}', this, '${product.name}')" title="Add to Cart">
                                    🛒 Add
                                </button>
                            </div>
                        </div>
                    `;
                });

                eventHTML += `</div>`;
                eventCard.innerHTML = eventHTML;
                eventsList.appendChild(eventCard);
            });

            container.classList.remove('hidden');

            // Setup image loading for offer products
            setupAllDirectImageLoading();

            console.log(`✅ Rendered ${sectionData.events.length} events with offers`);
        }

        // =================== ENHANCED DASHBOARD LOADING ===================

        async function loadDashboard() {
            try {
                console.log('🏠 Loading enhanced dashboard...');
                showDashboardLoading();

                const response = await fetch('/get_dashboard_data', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                console.log('📊 Dashboard data received:', data);

                if (data.success) {
                    dashboardData = data;
                    renderDashboardSections(data);

                    // Hide results section when dashboard is shown
                    document.getElementById('resultsSection').style.display = 'none';
                } else {
                    if (data.error && data.error.includes('Not logged in')) {
                        window.location.href = '/';
                    } else {
                        showDashboardError(data.error || 'Failed to load dashboard');
                    }
                }
            } catch (error) {
                console.error('⚠️ Dashboard loading error:', error);
                showDashboardError('An error occurred while loading your dashboard');
            }
        }

        function renderDashboardSections(data) {
            const container = document.getElementById('dashboardContainer');
            let html = '';

            const sections = data.sections;
            const hasPreferences = data.has_preferences;
            const hasBirthdayCelebration = data.has_birthday_celebration;
            const userState = data.user_state;

            // Show user state info
            // if (userState && (userState.liked_count > 0 || userState.cart_count > 0 || userState.selected_subcategories.length > 0)) {
            //     html += `
            //         <div class="user-state-info">
            //             <div class="state-title">
            //                 <i class="fas fa-user-circle"></i> Your Personalization Status
            //             </div>
            //             <div class="state-content">
            //                 ${userState.selected_subcategories.length > 0 ? `🎯 Interests: ${userState.selected_subcategories.join(', ')} • ` : ''}
            //                 ${userState.liked_count > 0 ? `❤️ ${userState.liked_count} liked • ` : ''}
            //                 ${userState.cart_count > 0 ? `🛒 ${userState.cart_count} in cart • ` : ''}
            //                 ${userState.interactions_count} total interactions (24-hour cache)
            //             </div>
            //         </div>
            //     `;
            // }
            // 0. BIRTHDAY CELEBRATION SECTION 
            if (sections.birthday_celebration) {
                html += renderBirthdayCelebrationSection(sections.birthday_celebration);
                console.log('🎂 Birthday celebration section added!');
            }

            // 1. CURRENT EVENTS SECTION 
            if (sections.current_events) {
                html += renderCurrentEventsSection(sections.current_events);
            }

            // 2. CONTINUE SHOPPING SECTION (now with grid layout like other sections)
            if (sections.continue_shopping) {
                html += renderContinueShoppingSection(sections.continue_shopping);
            }

            // 3. YOUR SHOPPING TRENDS SECTION (only if user has preferences) - WITH SMALL CARDS
            if (hasPreferences && sections.shopping_trends) {
                html += renderShoppingTrendsSection(sections.shopping_trends);
            }

            // 4. ALL PRODUCTS SECTION (now with initial products)
            if (sections.all_products) {
                html += renderAllProductsSection(sections.all_products);
            }

            container.innerHTML = html;

            // Apply user interaction states
            applyUserInteractionStates();

            // Setup DIRECT image loading for all product images
            setupAllDirectImageLoading();

            console.log('✅ Dashboard rendered successfully with', hasPreferences ? '4' : '3', 'sections');
            console.log('✅ Dashboard rendered successfully with', hasBirthdayCelebration ? 'birthday celebration!' : 'standard sections');
        }

        function renderCurrentEventsSection(sectionData) {
            const events = sectionData.events || [];

            return `
                <div class="dashboard-section events-section">
                    <div class="section-header">
                        <div>
                            <div class="section-title">
                                <span class="section-icon">${sectionData.icon}</span>
                                <h2>${sectionData.title}</h2>
                            </div>
                            <p class="section-subtitle">${sectionData.subtitle}</p>
                            <div class="section-description">${sectionData.description || 'Check out ongoing events and personalized offers'}</div>
                        </div>
                        <div class="section-stats">
                            <span>${events.length} active events</span>
                        </div>
                    </div>
                    <div class="events-grid">
                        ${events.map(event => `
                            <div class="event-card">
                                ${event.banner_image_url ? `<img src="${event.banner_image_url}" class="event-banner" alt="${event.event_name}" onerror="this.style.display='none'">` : ''}

                                <p class="event-description">${event.event_description}</p>
                                
                                <div class="offer-product-grid">
                                    ${event.offers.map(offer => {
                const product = offer.product;
                const matchesPreferences = offer.matches_preferences;

                return `
                                            <div class="offer-product-card ${matchesPreferences ? 'matches-pref' : ''}" data-product-id="${product._id}">
                                                <img src="" 
                                                     alt="${product.name}" 
                                                     data-image-url="${product.image || ''}"
                                                     data-product-name="${product.name}"
                                                     onerror="this.src='https://via.placeholder.com/80x80/f8f9fa/667eea?text=Item'">
                                                
                                                <div class="offer-product-name">${product.name}</div>

                                                <div class="offer-description">${offer.offer_description}</div>
                                                
                                                <div class="offer-actions">
                                                    <button class="offer-btn like-offer-btn" onclick="toggleLike('${product._id}', this)" title="Like">

                                                    </button>

                                                </div>
                                            </div>
                                        `;
            }).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderContinueShoppingSection(sectionData) {
            const products = sectionData.products || [];
            const hasMore = sectionData.has_more;

            return `
                <div class="dashboard-section continue-shopping">
                    <div class="section-header">
                        <div>
                            <div class="section-title">
                                <span class="section-icon">${sectionData.icon}</span>
                                <h2>${sectionData.title}</h2>
                            </div>
                            <p class="section-subtitle">${sectionData.subtitle}</p>
                            <div class="section-description">${sectionData.description || 'Products similar to ones you\'ve recently liked or added to cart'}</div>
                        </div>
                        <div class="section-stats">
                            <span>${products.length} products</span>
                            ${hasMore ? `
                                <button class="show-more-btn" onclick="loadMoreContinueShopping()" id="showMoreBtn">
                                    <i class="fas fa-plus"></i> Show More
                                </button>
                            ` : ''}
                        </div>
                    </div>
                    <div class="products-carousel" id="continueShoppingCarousel">
                        ${products.map((product, index) => `
                            ${renderProductCard(product, 'continue-shopping')}
                        `).join('')}
                    </div>
                    <div id="continueShoppingMore" style="display: none;">
                        <!-- More products will be loaded here -->
                    </div>
                </div>
            `;
        }

        function renderShoppingTrendsSection(sectionData) {
            const products = sectionData.products || [];

            return `
                <div class="dashboard-section shopping-trends">
                    <div class="section-header">
                        <div>
                            <div class="section-title">
                                <span class="section-icon">${sectionData.icon}</span>
                                <h2>${sectionData.title}</h2>
                            </div>
                            <p class="section-subtitle">${sectionData.subtitle}</p>
                            <div class="section-description">${sectionData.description || 'Based on recent interactions and similarity'}</div>

                        <div class="section-stats">
                            <span>${products.length} trending for you</span>

        function renderProductCard(product, section = '', isSmall = false) {
            const imageUrl = product.image;
            const interactionBadge = getInteractionBadge(product);
            const cardClasses = getProductCardClasses(product) + (isSmall ? ' small' : '');

            // Check for offer information
            const hasOffer = product.offer && product.offer.discounted_price;

            let priceDisplay = `<div class="product-price">${product.price}</div>`;
            let offerBadge = '';

            if (hasOffer) {
                offerBadge = `<div class="product-offer-badge">${product.offer.discount_percentage}% OFF</div>`;
                priceDisplay = `
                    <div class="product-price-with-offer">
                        <div class="original-product-price">${product.offer.original_price}</div>
                        <div class="discounted-product-price">$${product.offer.discounted_price}</div>
                    </div>
                `;
            }

            return `
                <div class="product-card ${cardClasses}" data-product-id="${product._id}">
                    ${offerBadge}
                    ${interactionBadge}
                    <div class="product-image-container" onclick="viewProduct('${product.productUrl}', '${product._id}', '${product.name}')">
                        <img class="product-image" 
                             alt="${product.name}"
                             data-image-url="${product.image || ''}"
                             data-product-name="${product.name}">
                        <div class="product-actions-top">
                            <button class="btn-like" onclick="event.stopPropagation(); toggleLike('${product._id}', this)" title="Like">❤️</button>
                            <button class="btn-dislike" onclick="event.stopPropagation(); toggleDislike('${product._id}', this)" title="Dislike">👎</button>
                        </div>
                    </div>
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        <div class="product-meta">
                            <span>${product.brand || 'Brand'}</span>
                            <span>${product.sub_category || 'Category'}</span>
                        </div>
                        ${priceDisplay}
                        <div class="product-rating">
                            <span class="stars">${'⭐'.repeat(Math.floor(product.rating || 4))}</span>
                            <span>${(product.rating || 4).toFixed(1)} (${product.review_count || 0})</span>
                        </div>
                        ${product.rerank_score ? `
                            <div class="product-rerank-info">
                                Score: ${product.rerank_score.toFixed(2)} 
                                (Interaction: ${product.interaction_score?.toFixed(1) || 0} + Rating: ${product.rating_score?.toFixed(1) || 0})
                            </div>
                        ` : ''}
                        ${hasOffer ? `<div class="product-reason">🎉 ${product.offer.offer_description}</div>` : ''}
                        <button class="add-to-cart-btn" onclick="event.stopPropagation(); addToCart('${product._id}', this, '${product.name}')">
                            <i class="fas fa-cart-plus"></i> Add to Cart
                        </button>
                    </div>
                </div>
            `;
        }

        function getInteractionBadge(product) {
            if (product.is_liked) {
                return '';
            } else if (product.is_in_cart) {
                return '';
            } else if (product.matches_preference) {
                return '';
            }
            return '';
        }

        function getProductCardClasses(product) {
            let classes = '';
            if (product.is_liked) classes += ' liked';
            if (product.is_in_cart) classes += ' cart-added';
            if (product.matches_preference) classes += ' preference-match';
            return classes;
        }

        async function loadCategoryProducts(category, subcategory) {
            try {
                console.log(`📦 Loading products for ${category} > ${subcategory}`);

                // Update active selection
                activeCategory = category;
                activeSubcategory = subcategory;

                // Update button states
                updateSubcategoryButtons(category, subcategory);

                // Show loading in category products container
                const categoryId = category.toLowerCase().replace(/\s+/g, '-');
                const container = document.getElementById(`products-${categoryId}`);
                container.innerHTML = `
                    <div class="category-products-loading">
                        <div class="spinner"></div>
                        <p>Loading ${subcategory} products...</p>
                    </div>
                `;

                const response = await fetch('/get_category_products', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        category: category,
                        subcategory: subcategory,
                        limit: 12
                    })
                });

                const data = await response.json();
                console.log(`📊 Category products response:`, data);

                if (data.success) {
                    displayCategoryProducts(container, data.products, category, subcategory);
                } else {
                    if (data.error && data.error.includes('Not logged in')) {
                        window.location.href = '/';
                    } else {
                        showCategoryProductsError(container, data.error || 'Failed to load products');
                    }
                }
            } catch (error) {
                console.error('⚠️ Category products loading error:', error);
                const categoryId = category.toLowerCase().replace(/\s+/g, '-');
                const container = document.getElementById(`products-${categoryId}`);
                showCategoryProductsError(container, 'An error occurred while loading products');
            }

        function createProductCard(product, position = null, sectionClass = 'single-section', isSmall = false) {
            const imageUrl = product.image;
            const productName = product.name || 'Product';
            const productPrice = product.price || '$0.00';
            const productId = product._id || '';
            const productBrand = product.brand || 'Brand';
            const subCategory = product.sub_category || '';
            const rating = product.rating || 4.0;
            const reviewCount = product.review_count || 0;
            const reason = product.reason || '';

            let reasonDisplay = '';
            if (reason) {
                reasonDisplay = `<div class="product-reason">${reason}</div>`;
            }

            // Add interaction count for other users section
            let interactionInfo = '';
            if (product.interaction_count && product.users_count) {
                interactionInfo = `<div class="product-rerank-info">
                    ${product.interaction_count} interactions by ${product.users_count} users
                </div>`;
            }

            // Check for offer information
            const hasOffer = product.offer && product.offer.discounted_price;
            let priceDisplay = `<div class="product-price">${productPrice}</div>`;
            let offerBadge = '';

            if (hasOffer) {
                offerBadge = `<div class="product-offer-badge">${product.offer.discount_percentage}% OFF</div>`;
                priceDisplay = `
                    <div class="product-price-with-offer">
                        <div class="original-product-price">${product.offer.original_price}</div>
                        <div class="discounted-product-price">${product.offer.discounted_price}</div>
                    </div>
                `;
            }

            const cardClasses = isSmall ? 'product-card small' : 'product-card';

            return `
                <div class="${cardClasses}" data-product-id="${productId}" data-subcategory="${subCategory}">
                    ${offerBadge}
                    <div class="product-image-container" onclick="viewProduct('${product.productUrl}', '${productId}', '${productName}')">
                        <img class="product-image" 
                             alt="${productName}"
                             data-image-url="${imageUrl}"
                             data-product-name="${productName}">
                        <div class="product-actions-top">
                            <button class="btn-like" onclick="event.stopPropagation(); toggleLike('${productId}', this)" title="Like">❤️</button>
                            <button class="btn-dislike" onclick="event.stopPropagation(); toggleDislike('${productId}', this)" title="Dislike">👎</button>
                        </div>
                    </div>
                    <div class="product-info">
                        <div class="product-name">${productName}</div>
                        <div class="product-brand">${productBrand}${subCategory ? ` • ${subCategory}` : ''}</div>

                        ${reasonDisplay}
                        ${interactionInfo}
                        ${hasOffer ? `<div class="product-reason">🎉 ${product.offer.offer_description}</div>` : ''}
                        <div class="product-bottom">
                            <div class="product-reviews">⭐ ${rating} (${reviewCount})</div>

        async function toggleLike(productId, button) {
            if (!productId) return;

            try {
                const isLiked = button.classList.contains('liked');
                const interactionType = isLiked ? 'view' : 'like';

                console.log(`👍 ${interactionType} interaction on product:`, productId);

                const response = await fetch('/track_interaction', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        product_id: productId,
                        type: interactionType
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Update UI immediately
                    const card = button.closest('.product-card, .offer-product-card, .birthday-offer-card');

                    if (!isLiked) {
                        // User liked the product
                        button.classList.add('liked');
                        card.classList.add('liked');
                        userInteractions.liked.add(productId);

                        // Remove from disliked if present
                        userInteractions.disliked.delete(productId);
                        card.classList.remove('disliked');
                        const dislikeBtn = card.querySelector('.btn-dislike');
                        if (dislikeBtn) dislikeBtn.classList.remove('disliked');

                        // Show preference notification
                        showPreferenceNotification(
                            'Product Liked! ❤️',
                            "We'll show you more products like this",
                            'like'
                        );
                    } else {
                        // User unliked the product
                        button.classList.remove('liked');
                        card.classList.remove('liked');
                        userInteractions.liked.delete(productId);
                    }

                    console.log(`✅ Successfully tracked ${interactionType} interaction`);
                } else {
                    if (data.error && data.error.includes('Not logged in')) {
                        window.location.href = '/';
                    } else {
                        console.error('Failed to track like interaction:', data.error);
                    }
                }
            } catch (error) {
                console.error('Error tracking like:', error);
            }
        }

        async function addToCart(productId, button, productName = 'Product') {
            if (!productId) {
                console.error('No product ID provided');
                return;
            }

            try {
                // Show immediate loading state
                if (button) {
                    const originalHTML = button.innerHTML;
                    button.classList.add('adding');
                    button.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                    button.disabled = true;
                }

                const response = await fetch('/add_to_cart', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        product_id: productId,
                        quantity: 1
                    })
                });

                const data = await response.json();

                if (data.success) {
                    const card = button?.closest('.product-card, .offer-product-card');

                    // Update UI immediately
                    userInteractions.cart.add(productId);
                    if (card) {
                        card.classList.add('cart-added');
                    }

                    // Show success state
                    if (button) {
                        button.classList.remove('adding');
                        button.classList.add('added');
                        button.innerHTML = '<i class="fas fa-check"></i> Added!';

                        // Reset button after 2 seconds
                        setTimeout(() => {
                            button.classList.remove('added');
                            button.innerHTML = '<i class="fas fa-cart-plus"></i> Add';
                            button.disabled = false;
                        }, 2000);
                    }

                    // Show preference notification
                    showPreferenceNotification(
                        'Added to Cart! 🛒',
                        "We'll prioritize similar products for you",
                        'cart'
                    );

                    showNotification(`${productName} added to cart!`, 'success');
                    await loadCart(true);

                    console.log(`✅ Successfully added ${productName} to cart`);
                } else {
                    if (data.error && data.error.includes('Not logged in')) {
                        window.location.href = '/';
                        return;
                    }
                    throw new Error(data.error || 'Failed to add to cart');
                }

            } catch (error) {
                console.error('Error adding to cart:', error);

                if (button) {
                    button.classList.remove('adding');
                    button.innerHTML = '<i class="fas fa-cart-plus"></i> Add';
                    button.disabled = false;
                }

                showNotification(`Failed to add ${productName} to cart`, 'error');
            }
        }

        function showPreferenceNotification(title, message, type) {
            const notification = document.getElementById('preferenceNotification');
            const titleEl = document.getElementById('prefNotificationTitle');
            const textEl = document.getElementById('prefNotificationText');

            // Set content
            titleEl.textContent = title;
            textEl.textContent = message;

            // Set type-specific styling
            notification.classList.remove('show', 'like', 'cart', 'dislike');
            notification.classList.add(type);

            // Show notification
            setTimeout(() => {
                notification.classList.add('show');
            }, 100);

            // Hide after 4 seconds
            setTimeout(() => {
                notification.classList.remove('show');
            }, 4000);
        }

        // =================== ENHANCED CART FUNCTIONALITY ===================

        function toggleCart() {
            const sidebar = document.getElementById('cartSidebar');
            const overlay = document.getElementById('overlay');

            cartOpen = !cartOpen;

            if (cartOpen) {
                sidebar.classList.add('open');
                overlay.classList.add('show');
                loadCart();
            } else {
                sidebar.classList.remove('open');
                overlay.classList.remove('show');
            }

        async function loadCart(silent = false) {
            try {
                const response = await fetch('/cart', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        cartItems = data.cart.items || [];
                        updateCartDisplay();
                        updateCartCount();

                        // Update user interactions for cart items
                        cartItems.forEach(item => {
                            userInteractions.cart.add(item.product_id);
                        });

                        // Apply states to visible product cards
                        applyUserInteractionStates();

                        if (!silent) {
                            console.log('Cart loaded:', cartItems.length, 'items');
                        }
                    } else {
                        if (data.error && data.error.includes('Not logged in')) {
                            window.location.href = '/';
                        }
                    }
                } else {
                    console.error('Failed to load cart:', response.status);
                }
            } catch (error) {
                console.error('Error loading cart:', error);
            }
        }

        function updateCartDisplay() {
            const cartContent = document.getElementById('cartContent');
            const cartFooter = document.getElementById('cartFooter');
            const cartTotal = document.getElementById('cartTotal');

            if (cartItems.length === 0) {
                cartFooter.style.display = 'none';
                cartContent.innerHTML = `
                    <div class="cart-empty">
                        <i class="fas fa-shopping-cart"></i>
                        <p>Your cart is empty</p>
                        <small>Start shopping to add items!</small>
                    </div>
                `;
            } else {
                cartFooter.style.display = 'block';

                let total = 0.0;
                let cartHTML = '';

                cartItems.forEach((item, index) => {
                    const price_str = item.price;
                    const price_match = price_str.match(/[\d.]+/);
                    const price = price_match ? parseFloat(price_match[0]) : 0.0;
                    const quantity = item.quantity;
                    const itemTotal = price * quantity;
                    total += itemTotal;

                    // DIRECT image URL processing for cart items
                    const cartImageUrl = getDirectImageUrl(item.image_url) || `https://via.placeholder.com/60x60/f8f9fa/667eea?text=${encodeURIComponent(item.name.substring(0, 5))}`;

                    cartHTML += `
                        <div class="cart-item" data-product-id="${item.product_id}">
                            <img src="${cartImageUrl}" alt="${item.name}" class="cart-item-image" onerror="this.src='https://via.placeholder.com/60x60/f8f9fa/667eea?text=Item'">
                            <div class="cart-item-details">
                                <div class="cart-item-name">${item.name}</div>
                                <div class="cart-item-price">${item.price} x ${quantity} = ${itemTotal.toFixed(2)}</div>
                                <button onclick="removeFromCart('${item.product_id}', '${item.name}')" style="background: #ef4444; color: white; border: none; padding: 0.25rem 0.5rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem; margin-top: 0.5rem;">
                                    <i class="fas fa-trash"></i> Remove
                                </button>
                            </div>
                        </div>
                    `;
                });

                cartContent.innerHTML = cartHTML;
                cartTotal.textContent = `Total: ${total.toFixed(2)}`;
            }
        }

        function updateCartCount() {
            const cartCount = document.getElementById('cartCount');
            const totalItems = cartItems.reduce((sum, item) => sum + item.quantity, 0);

            cartCount.textContent = totalItems;
            cartCount.style.display = totalItems > 0 ? 'flex' : 'none';
        }

        async function removeFromCart(productId, productName) {
            try {
                const response = await fetch('/cart', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        action: 'remove',
                        product_id: productId
                    })
                });

                const data = await response.json();
                if (data.success) {
                    cartItems = data.cart.items || [];
                    updateCartDisplay();
                    updateCartCount();

                    // Update user interactions
                    userInteractions.cart.delete(productId);
                    applyUserInteractionStates();

                    showNotification(`${productName} removed from cart`, 'success');
                } else {
                    if (data.error && data.error.includes('Not logged in')) {
                        window.location.href = '/';
                    }
                }
            } catch (error) {
                console.error('Error removing from cart:', error);
            }
        }

        async function clearCart() {
            if (cartItems.length === 0) {
                showNotification('Your cart is already empty!', 'info');
                return;
            }

            if (!confirm('Are you sure you want to clear your cart?')) {
                return;
            }

            try {
                const response = await fetch('/cart', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        action: 'clear'
                    })
                });

                const data = await response.json();
                if (data.success) {
                    cartItems = [];
                    updateCartDisplay();
                    updateCartCount();

                    // Clear cart interactions
                    userInteractions.cart.clear();
                    applyUserInteractionStates();

                    showNotification('Cart cleared successfully!', 'success');
                } else {
                    if (data.error && data.error.includes('Not logged in')) {
                        window.location.href = '/';
                    }
                }
            } catch (error) {
                console.error('Error clearing cart:', error);
            }
        }

        function checkout() {
            if (cartItems.length === 0) {
                showNotification('Your cart is empty! Add some products first.', 'info');
                return;
            }

            showNotification('🚀 Checkout functionality coming soon! This is a demo version.', 'info');
        }

        // =================== UTILITY FUNCTIONS ===================

        function showDashboardLoading() {
            const container = document.getElementById('dashboardContainer');
            container.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading your personalized dashboard...</p>
                </div>
            `;
        }

        function showDashboardError(message) {
            const container = document.getElementById('dashboardContainer');
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-triangle"></i>
                    <h3>Dashboard Error</h3>
                    <p>${message}</p>
                    <button onclick="loadDashboard()" style="margin-top: 1rem; padding: 0.75rem 1.5rem; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer;">
                        <i class="fas fa-refresh"></i> Retry
                    </button>
                </div>
            `;
        }

        function applyUserInteractionStates() {
            // Apply current interaction states to all product cards (including offer cards)
            document.querySelectorAll('.product-card, .offer-product-card').forEach(card => {
                const productId = card.dataset.productId;

                // Reset classes
                card.classList.remove('liked', 'cart-added', 'disliked');

                // Apply current states
                if (userInteractions.liked.has(productId)) {
                    card.classList.add('liked');
                    const likeBtn = card.querySelector('.btn-like, .like-offer-btn');
                    if (likeBtn) likeBtn.classList.add('liked');
                }

                if (userInteractions.cart.has(productId)) {
                    card.classList.add('cart-added');
                }

                if (userInteractions.disliked.has(productId)) {
                    card.classList.add('disliked');
                    const dislikeBtn = card.querySelector('.btn-dislike');
                    if (dislikeBtn) dislikeBtn.classList.add('disliked');
                }
            });
        }

        function viewProduct(productUrl, productId, productName) {
            console.log('🔗 ViewProduct called:', { productUrl, productId, productName });

            if (productId) {
                trackInteraction(productId, 'view');
            }

            if (productUrl && productUrl !== '#' && productUrl !== '') {
                try {
                    window.open(productUrl, '_blank', 'noopener,noreferrer');
                } catch (error) {
                    console.error('Error opening URL:', error);
                    alert(`Unable to open product page for: ${productName}`);
                }
            } else {
                alert(`Product page not available for: ${productName}`);
            }
        }

        async function trackInteraction(productId, type) {
            try {
                await fetch('/track_interaction', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        product_id: productId,
                        type: type
                    })
                });
            } catch (error) {
                console.error('Error tracking interaction:', error);
            }
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            const text = document.getElementById('notificationText');

            notification.classList.remove('show', 'success', 'error', 'info');
            text.textContent = message;
            notification.classList.add(type);

            setTimeout(() => {
                notification.classList.add('show');
            }, 100);

            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                console.log('🔓 Logging out user...');
                window.location.href = '/logout';
            }
        }

        function closeOverlay() {
            const overlay = document.getElementById('overlay');
            const cartSidebar = document.getElementById('cartSidebar');

            if (cartOpen) {
                cartSidebar.classList.remove('open');
                cartOpen = false;
            }

            overlay.classList.remove('show');
        }

        // =================== ENHANCED INITIALIZATION ===================

        document.addEventListener('DOMContentLoaded', function () {
            console.log('🚀 Initializing Enhanced Dashboard with Events Integration...');

            try {
                // Initialize search input
                const searchInput = document.getElementById('searchInput');
                if (searchInput) {
                    searchInput.addEventListener('keypress', function (e) {
                        if (e.key === 'Enter') {
                            performSearch();
                        }
                    });
                } else {
                    throw new Error('Search input element not found');
                }

                // Close overlays when clicking outside
                document.addEventListener('click', function (e) {
                    // Handle cart sidebar
                    const cartSidebar = document.getElementById('cartSidebar');
                    const cartIcon = document.querySelector('.cart-icon');

                    if (cartOpen && !cartSidebar.contains(e.target) && !cartIcon.contains(e.target)) {
                        closeOverlay();
                    }
                });

                // Load cart and initialize user states
                loadCart(true);

                // Initialize keyboard shortcuts
                document.addEventListener('keydown', function (e) {
                    // ESC to close overlays or return to dashboard
                    if (e.key === 'Escape') {
                        if (cartOpen) {
                            closeOverlay();
                        } else if (!dashboardMode) {
                            returnToDashboard();
                        }
                    }

                    // Ctrl/Cmd + K to focus search
                    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                        e.preventDefault();
                        if (searchInput) {
                            searchInput.focus();
                            searchInput.select();
                        }
                    }

                    // Ctrl/Cmd + H to return to dashboard
                    if ((e.ctrlKey || e.metaKey) && e.key === 'h') {
                        e.preventDefault();
                        returnToDashboard();
                    }
                });

                // Add visibility change handler
                document.addEventListener('visibilitychange', function () {
                    if (document.hidden) {
                        console.log('💾 Tab switched away - 24-hour cache maintained');
                    } else {
                        loadCart(true);
                        if (dashboardMode) {
                            // Refresh dashboard if it's been more than 5 minutes
                            const lastLoad = localStorage.getItem('lastDashboardLoad');
                            const now = Date.now();
                            if (!lastLoad || (now - parseInt(lastLoad)) > 300000) { // 5 minutes
                                loadDashboard();
                                localStorage.setItem('lastDashboardLoad', now.toString());
                            }
                        }
                    }
                });

                // Add smooth scroll behavior
                document.documentElement.style.scrollBehavior = 'smooth';

                // Load dashboard sections on initialization
                console.log('🎯 Auto-loading dashboard with Events Integration...');
                setTimeout(() => {
                    loadDashboard();
                    localStorage.setItem('lastDashboardLoad', Date.now().toString());
                }, 500); // Small delay to ensure everything is initialized

                // Initialize performance monitoring
                if ('performance' in window) {
                    window.addEventListener('load', function () {
                        setTimeout(function () {
                            try {
                                const perfData = performance.getEntriesByType('navigation')[0];
                                if (perfData) {
                                    console.log('📊 Page load performance:', Math.round(perfData.loadEventEnd - perfData.loadEventStart), 'ms');
                                }
                            } catch (e) {
                                console.warn('Performance monitoring failed:', e);
                            }
                        }, 1000);
                    });
                }

                console.log('✅ Enhanced Dashboard with Events Integration initialized successfully!');
                console.log('🎯 NEW EVENTS FEATURES:');
                console.log('  • Events collection integration');
                console.log('  • Current Offers & Events dashboard section');
                console.log('  • Event-specific product offers with discounts');
                console.log('  • Personalized offer highlighting based on user preferences');
                console.log('  • Event banner display with offer grids');
                console.log('  • Events query handling (search for "offers", "events", etc.)');
                console.log('  • Real-time offer information in product cards');
                console.log('  • Mobile-responsive events display');
                console.log('  • Direct integration with existing cart and interactions');

            } catch (error) {
                console.error('⚠️ Failed to initialize enhanced dashboard:', error);
                showDashboardError('Failed to initialize the dashboard. Please refresh the page.');
            }
        });

        // Final performance log
        window.addEventListener('load', function () {
            try {
                console.log('📊 ENHANCED EVENTS INTEGRATION Performance Summary:');
                console.log('  ✅ JavaScript execution complete');
                console.log('  ✅ Events rendering system active');
                console.log('  ✅ Offer highlighting functional');
                console.log('  ✅ Event-based search queries working');
                console.log('  ✅ Dashboard sections with events loading');
                console.log('  ✅ Mobile-responsive events display ready');
                console.log('  ✅ All interactive features operational');
                console.log('🚀 System ready with COMPLETE EVENTS INTEGRATION!');

            } catch (error) {
                console.error('Error in final initialization:', error);
            }
        });

        // Export functions for debugging (development only)
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            window.debugFunctions = {
                loadDashboard,
                returnToDashboard,
                loadCategoryProducts,
                showNotification,
                showPreferenceNotification,
                applyUserInteractionStates,
                setupAllDirectImageLoading,
                getDirectImageUrl,
                setupDirectImageLoading,
                userInteractions,
                dashboardData,
                cartItems,
                renderEventsSection,
                displayEventsResponse
            };
            console.log('🛠️ Debug functions available in window.debugFunctions');
        }

        // Add error boundary for unhandled errors
        window.addEventListener('error', function (e) {
            console.error('🚨 Unhandled error:', e.error);
            showNotification('An unexpected error occurred. The page will continue to work normally.', 'error');
        });

        window.addEventListener('unhandledrejection', function (e) {
            console.error('🚨 Unhandled promise rejection:', e.reason);
            showNotification('A background operation failed. Functionality may be affected.', 'error');
        });

    </script>
</body>

</html>
