<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InsightRecs - Create Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
            overflow: hidden;
        }

        /* Animated Background Elements */
        .background-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .shape {
            position: absolute;
            opacity: 0.1;
            animation: float 6s ease-in-out infinite;
        }

        .shape:nth-child(1) {
            top: 10%;
            left: 10%;
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            top: 20%;
            right: 10%;
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 20px;
            animation-delay: 2s;
        }

        .shape:nth-child(3) {
            bottom: 10%;
            left: 20%;
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            animation-delay: 4s;
        }

        .shape:nth-child(4) {
            bottom: 30%;
            right: 20%;
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 15px;
            animation-delay: 1s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .register-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            padding: 3rem 2.5rem;
            position: relative;
            z-index: 1;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            text-align: center;
            color: #6b7280;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            font-weight: 400;
        }

        .error {
            background: linear-gradient(135deg, #fef2f2 0%, #fef8f8 100%);
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-row {
            display: flex;
            gap: 1rem;
        }

        .form-row .form-group {
            flex: 1;
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #374151;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 1rem;
            z-index: 2;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #f9fafb;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input:focus + .input-icon, .form-group select:focus + .input-icon {
            color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .login-link {
            text-align: center;
            color: #6b7280;
            font-size: 0.9rem;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .login-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        /* Loading State */
        .btn.loading {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .btn.loading .btn-text {
            display: none;
        }

        .btn.loading .spinner {
            display: inline-block;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Age indicator for birthday field */
        .age-indicator {
            font-size: 0.8rem;
            color: #6b7280;
            margin-top: 0.25rem;
            font-style: italic;
        }

        .age-indicator.error {
            color: #dc2626;
        }

        .age-indicator.success {
            color: #059669;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .register-container {
                padding: 2rem 1.5rem;
                margin: 1rem;
                max-width: 400px;
            }

            .logo {
                font-size: 2rem;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }

        /* Focus states for keyboard navigation */
        .btn:focus,
        input:focus,
        select:focus {
            outline: 2px solid #667eea;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="background-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="register-container">
        <div class="logo">InsightRecs</div>
        <div class="tagline">Create your intelligent shopping account</div>
        
        {% if error %}
        <div class="error">
            <i class="fas fa-exclamation-triangle"></i>
            {{ error }}
        </div>
        {% endif %}
        
        <form method="POST" action="/register" id="registerForm">
            <div class="form-group">
                <label for="name">
                    <i class="fas fa-user"></i>
                    Full Name
                </label>
                <div class="input-wrapper">
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                    <i class="fas fa-user input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="email">
                    <i class="fas fa-envelope"></i>
                    Email Address
                </label>
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    <i class="fas fa-envelope input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i>
                    Password
                </label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="Create a password" required minlength="6">
                    <i class="fas fa-lock input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="location">
                    <i class="fas fa-map-marker-alt"></i>
                    Location
                </label>
                <div class="input-wrapper">
                    <input type="text" id="location" name="location" placeholder="e.g., Bangalore, Delhi, Mumbai" required>
                    <i class="fas fa-map-marker-alt input-icon"></i>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="birthday">
                        <i class="fas fa-calendar-alt"></i>
                        Date of Birth
                    </label>
                    <div class="input-wrapper">
                        <input type="date" id="birthday" name="birthday" required>
                        <i class="fas fa-calendar-alt input-icon"></i>
                    </div>
                    <div class="age-indicator" id="ageIndicator"></div>
                </div>

                <div class="form-group">
                    <label for="gender">
                        <i class="fas fa-user"></i>
                        Gender
                    </label>
                    <div class="input-wrapper">
                        <select id="gender" name="gender" required>
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                            <option value="Prefer not to say">Prefer not to say</option>
                        </select>
                        <i class="fas fa-user input-icon"></i>
                    </div>
                </div>
            </div>
            
            <button type="submit" class="btn" id="registerBtn">
                <span class="btn-text">
                    <i class="fas fa-user-plus"></i>
                    Create Account
                </span>
                <div class="spinner"></div>
            </button>
        </form>
        
        <div class="login-link">
            Already have an account? <a href="/">Sign in here</a>
        </div>
    </div>

    <script>
        // Function to calculate age from birthday
        function calculateAge(birthday) {
            const today = new Date();
            const birthDate = new Date(birthday);
            let age = today.getFullYear() - birthDate.getFullYear();
            const monthDiff = today.getMonth() - birthDate.getMonth();
            
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            
            return age;
        }

        // Function to update age indicator
        function updateAgeIndicator() {
            const birthdayInput = document.getElementById('birthday');
            const ageIndicator = document.getElementById('ageIndicator');
            
            if (birthdayInput.value) {
                const age = calculateAge(birthdayInput.value);
                
                if (age < 13) {
                    ageIndicator.textContent = `Age: ${age} years (Minimum age: 13)`;
                    ageIndicator.className = 'age-indicator error';
                } else if (age > 120) {
                    ageIndicator.textContent = `Age: ${age} years (Please check your birth date)`;
                    ageIndicator.className = 'age-indicator error';
                } else {
                    ageIndicator.textContent = `Age: ${age} years`;
                    ageIndicator.className = 'age-indicator success';
                }
            } else {
                ageIndicator.textContent = '';
                ageIndicator.className = 'age-indicator';
            }
        }

        // Set date constraints for birthday field
        function setDateConstraints() {
            const birthdayInput = document.getElementById('birthday');
            const today = new Date();
            
            // Maximum date: 13 years ago (minimum age requirement)
            const maxDate = new Date(today.getFullYear() - 13, today.getMonth(), today.getDate());
            birthdayInput.max = maxDate.toISOString().split('T')[0];
            
            // Minimum date: 120 years ago (reasonable maximum age)
            const minDate = new Date(today.getFullYear() - 120, today.getMonth(), today.getDate());
            birthdayInput.min = minDate.toISOString().split('T')[0];
        }

        // Enhanced form submission with age validation
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            const birthdayInput = document.getElementById('birthday');
            
            if (birthdayInput.value) {
                const age = calculateAge(birthdayInput.value);
                
                if (age < 13) {
                    e.preventDefault();
                    alert('You must be at least 13 years old to register.');
                    birthdayInput.focus();
                    return false;
                }
                
                if (age > 120) {
                    e.preventDefault();
                    alert('Please check your birth date. The age calculated seems incorrect.');
                    birthdayInput.focus();
                    return false;
                }
            }

            const btn = document.getElementById('registerBtn');
            btn.classList.add('loading');
            btn.disabled = true;
            console.log('🚀 Submitting registration form with date of birth...');
        });

        // Add event listener for birthday input changes
        document.getElementById('birthday').addEventListener('change', updateAgeIndicator);
        document.getElementById('birthday').addEventListener('input', updateAgeIndicator);

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 InsightRecs Registration Page Initialized with Date of Birth');
            
            // Set date constraints
            setDateConstraints();
            
            // Focus on first input
            document.getElementById('name').focus();
            
            // Add subtle entrance animation to shapes
            const shapes = document.querySelectorAll('.shape');
            shapes.forEach((shape, index) => {
                shape.style.animationDelay = `${index * 0.5}s`;
            });
        });
    </script>
</body>
</html>
