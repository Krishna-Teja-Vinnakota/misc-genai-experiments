<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InsightRecs - Set Your Preferences</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='onboarding.css') }}">
</head>
<body>
    <div class="onboarding-container">
        <!-- Header Section -->
        <div class="header-section">
            <div class="header-content">
                <div class="logo">
                    InsightRecs
                </div>
                <div class="tagline">
                    AI-Powered Personalized Shopping Experience
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content" id="preferencesStep">
            <div class="content-header">
                <h1 class="main-title">Choose Your Shopping Interests</h1>
            </div>
            
            <div class="categories-grid" id="categoriesContainer">
                <!-- Categories will be populated dynamically -->
            </div>




            
            <!-- Selection Summary -->
            <div class="selection-summary" id="selectionSummary" style="display: none;">
                <div class="summary-header">
                    <h3><i class="fas fa-check-circle"></i> Your Selections</h3>
                    <button class="clear-all-btn" onclick="clearAllSelections()">
                        <i class="fas fa-times"></i> Clear All
                    </button>
                </div>
                <div class="summary-tags" id="summaryContent">
                    <!-- Selected items will appear here -->
                </div>
            </div>
            
            <div class="action-buttons">
                <button class="btn btn-primary" id="saveBtn" onclick="savePreferences()">
                    <span class="btn-text"><i class="fas fa-rocket"></i> Start Smart Shopping</span>
                    <span class="btn-subtitle">With personalized experience</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p id="loadingText">Setting up your personalized shopping experience...</p>
        </div>
    </div>

    <script>
        let selectedCategories = [];
        let selectedSubcategories = [];
        let categoriesData = {};

        // Initialize the onboarding process
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🔧 Enhanced onboarding page loaded, initializing...');
            
            // Try to get categories from backend template variable
            try {
                const categoriesFromBackend = JSON.parse('{{ categories | tojson | safe }}');
                console.log('Categories from backend:', categoriesFromBackend);
                
                if (categoriesFromBackend && typeof categoriesFromBackend === 'object' && Object.keys(categoriesFromBackend).length > 0) {
                    categoriesData = categoriesFromBackend;
                    console.log('✅ Categories loaded from backend:', categoriesData);
                    populateCategoriesContainer();
                } else {
                    console.warn('⚠️ No valid categories from backend, loading from API...');
                    loadCategoriesFromAPI();
                }
            } catch (e) {
                console.error('❌ Error parsing categories from backend:', e);
                loadCategoriesFromAPI();
            }
        });

        // Load categories from API if backend data fails
        async function loadCategoriesFromAPI() {
            console.log('🔄 Loading categories from API...');
            try {
                const response = await fetch('/get_categories');
                const data = await response.json();
                
                if (data.success && data.categories && Object.keys(data.categories).length > 0) {
                    categoriesData = data.categories;
                    console.log('✅ Categories loaded from API:', categoriesData);
                    populateCategoriesContainer();
                } else {
                    console.error('❌ Failed to load categories from API:', data.error || 'No categories returned');
                    loadFallbackCategories();
                }
            } catch (error) {
                console.error('❌ Error loading categories from API:', error);
                loadFallbackCategories();
            }
        }

        // Load fallback categories if all else fails
        function loadFallbackCategories() {
            console.log('⚠️ Loading fallback categories...');
            categoriesData = {
                'Electronics': {
                    name: 'Electronics',
                    subcategories: ['Gaming', 'Batteries', 'Phones', 'Portable Audio', 'Computers', 'Accessories'],
                    count: 75
                },
                'Beauty': {
                    name: 'Beauty',
                    subcategories: ['Cosmetics', 'Hair Care', 'Skin Care', 'Soap & Body Wash', 'Nail Care', 'Fragrance'],
                    count: 79
                },
                'Food & Beverages': {
                    name: 'Food & Beverages',
                    subcategories: ['Baby Food', 'Cereals And Breakfast', 'Coffee And Tea', 'Frozen Foods', 'Snacks', 'Beverages'],
                    count: 74
                },
                'Personal Care': {
                    name: 'Personal Care',
                    subcategories: ['Health', 'Hygiene', 'Oral Care', 'Body Care', 'Baby Care'],
                    count: 45
                },
                'Home & Garden': {
                    name: 'Home & Garden',
                    subcategories: ['Kitchen', 'Cleaning', 'Storage', 'Decor', 'Tools'],
                    count: 60
                },
                'Clothing': {
                    name: 'Clothing',
                    subcategories: ['Men', 'Women', 'Kids', 'Accessories', 'Shoes'],
                    count: 35
                }
            };
            populateCategoriesContainer();
        }

        // Show error message
        function showError(message) {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = `
                <div class="error-state">
                    <i class="fas fa-exclamation-triangle" style="font-size: 3rem; margin-bottom: 1rem;"></i>
                    <h3>Error Loading Categories</h3>
                    <p>${message}</p>
                    <button onclick="location.reload()">
                        <i class="fas fa-redo"></i> Refresh Page
                    </button>
                </div>
            `;
        }

        // Populate categories container
        function populateCategoriesContainer() {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = '';

            if (!categoriesData || Object.keys(categoriesData).length === 0) {
                showError('No categories available. Please try again later.');
                return;
            }

            const categoryIcons = {
                'beauty': '💄',
    'electronics': '📱', 
    'food and beverages': '🍽️',
    'food & beverages': '🍽️',
    'personal care': '🧴',
    'health & wellness': '🥕',
    'home & garden': '🏠',
    'clothing': '👕',
    'toys': '🧸',
    'auto': '🚗',
    'office': '📄',
    'party': '🎉'
                // 'Electronics': '📱',
                // 'Beauty': '💄',
                // 'Food & Beverages': '🍽️',
                // 'Food & Beverage': '🍽️',
                // 'Personal Care': '🧴',
                // 'Health & Wellness': '🏥',
                // 'Home & Garden': '🏠',
                // 'Clothing': '👕',
                // 'Toys': '🧸',
                // 'Auto': '🚗',
                // 'Office': '📄',
                // 'Party': '🎉'
            };

            console.log('🎨 Creating category cards...');

            Object.keys(categoriesData).forEach((categoryKey, index) => { 
                const category = categoriesData[categoryKey];
                const icon = categoryIcons[categoryKey] || categoryIcons[category.name] || '🛒';
                
                console.log(`📦 Creating card for category: ${category.name} (${category.count} products)`);
                
                const categoryCard = document.createElement('div');
                categoryCard.className = 'category-card';
                categoryCard.dataset.category = categoryKey;
                categoryCard.style.animationDelay = `${index * 0.1}s`;
                
                const subcategories = Array.isArray(category.subcategories) ? category.subcategories : [];
                
                categoryCard.innerHTML = `
                    <div class="category-header" onclick="toggleCategory('${categoryKey}')">
                        <div class="category-icon">
                            <span>${icon}</span>
                        </div>
                        <div class="category-info">
                            <h3 class="category-name">${category.name}</h3>
                            <p class="category-count">${category.count} products</p>
                        </div>
                        <div class="category-check">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M16.25 6.875L8.125 15L3.75 10.625" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                    </div>
                    <div class="subcategories-section">
                        <div class="subcategories-list">
                            ${subcategories.map(subcategory => `
                                <div class="subcategory-chip" data-subcategory="${subcategory}" onclick="toggleSubcategory('${subcategory}', this)">
                                    <span class="chip-text">${subcategory}</span>
                                    <div class="chip-check">
                                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                                            <path d="M11.375 4.375L5.6875 10.0625L2.625 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        </svg>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                
                container.appendChild(categoryCard);
            });

            console.log(`✅ Created ${Object.keys(categoriesData).length} category cards`);
        }

        // Toggle category selection
        function toggleCategory(categoryKey) {
            console.log(`🔄 Toggling category: ${categoryKey}`);
            
            const card = document.querySelector(`[data-category="${categoryKey}"]`);
            const isSelected = selectedCategories.includes(categoryKey);
            
            if (isSelected) {
                selectedCategories = selectedCategories.filter(c => c !== categoryKey);
                card.classList.remove('selected');
                
                // Remove all subcategories of this category
                const categoryData = categoriesData[categoryKey];
                if (categoryData && categoryData.subcategories) {
                    categoryData.subcategories.forEach(subcategory => {
                        selectedSubcategories = selectedSubcategories.filter(s => s !== subcategory);
                        const subElement = card.querySelector(`[data-subcategory="${subcategory}"]`);
                        if (subElement) {
                            subElement.classList.remove('selected');
                        }
                    });
                }
                console.log(`➖ Removed category: ${categoryKey}`);
            } else {
                selectedCategories.push(categoryKey);
                card.classList.add('selected');
                console.log(`➕ Added category: ${categoryKey}`);
            }
            
            updateSelectionSummary();
            updateSaveButton();
        }

        // Toggle subcategory selection
        function toggleSubcategory(subcategory, element) {
            console.log(`🔄 Toggling subcategory: ${subcategory}`);
            
            if (selectedSubcategories.includes(subcategory)) {
                selectedSubcategories = selectedSubcategories.filter(s => s !== subcategory);
                element.classList.remove('selected');
                console.log(`➖ Removed subcategory: ${subcategory}`);
            } else {
                selectedSubcategories.push(subcategory);
                element.classList.add('selected');
                console.log(`➕ Added subcategory: ${subcategory}`);
            }
            
            updateSelectionSummary();
            updateSaveButton();
        }

        // Clear all selections
        function clearAllSelections() {
            console.log('🧹 Clearing all selections');
            
            selectedCategories = [];
            selectedSubcategories = [];
            
            document.querySelectorAll('.category-card.selected').forEach(card => {
                card.classList.remove('selected');
            });
            document.querySelectorAll('.subcategory-chip.selected').forEach(chip => {
                chip.classList.remove('selected');
            });
            
            updateSelectionSummary();
            updateSaveButton();
        }

        // Update selection summary
        function updateSelectionSummary() {
            const summaryDiv = document.getElementById('selectionSummary');
            const summaryContent = document.getElementById('summaryContent');
            
            if (selectedCategories.length === 0 && selectedSubcategories.length === 0) {
                summaryDiv.style.display = 'none';
                return;
            }
            
            summaryDiv.style.display = 'block';
            
            let html = '';
            
            if (selectedCategories.length > 0) {
                html += selectedCategories.map(cat => 
                    `<span class="selection-tag category-tag" onclick="removeSelection('category', '${cat}')">
                        <i class="fas fa-layer-group"></i>
                        ${categoriesData[cat].name} 
                        <span class="remove-tag">×</span>
                    </span>`
                ).join('');
            }
            
            if (selectedSubcategories.length > 0) {
                html += selectedSubcategories.map(subcat => 
                    `<span class="selection-tag subcategory-tag" onclick="removeSelection('subcategory', '${subcat}')">
                        <i class="fas fa-tag"></i>
                        ${subcat} 
                        <span class="remove-tag">×</span>
                    </span>`
                ).join('');
            }
            
            summaryContent.innerHTML = html;
        }

        // Remove individual selection
        function removeSelection(type, item) {
            if (type === 'category') {
                toggleCategory(item);
            } else if (type === 'subcategory') {
                const element = document.querySelector(`[data-subcategory="${item}"]`);
                toggleSubcategory(item, element);
            }
        }

        // Update save button state
        function updateSaveButton() {
            const saveBtn = document.getElementById('saveBtn');
            const btnText = saveBtn.querySelector('.btn-text');
            const btnSubtitle = saveBtn.querySelector('.btn-subtitle');
            
            const totalSelections = selectedCategories.length + selectedSubcategories.length;
            
            if (totalSelections === 0) {
                btnText.innerHTML = '<i class="fas fa-rocket"></i> Start Smart Shopping';
                btnSubtitle.textContent = 'With personalized experience';
            } else if (totalSelections <= 3) {
                btnText.innerHTML = '<i class="fas fa-rocket"></i> Start Smart Shopping';
                btnSubtitle.textContent = `With ${totalSelections} preference${totalSelections > 1 ? 's' : ''}`;
            } else {
                btnText.innerHTML = '<i class="fas fa-rocket"></i> Start Smart Shopping';
                btnSubtitle.textContent = `With ${totalSelections} personalized preferences`;
            }
        }

        // Save preferences
        async function savePreferences() {
            console.log('💾 Saving preferences...');
            console.log('  Categories:', selectedCategories);
            console.log('  Subcategories:', selectedSubcategories);
            
            document.getElementById('loadingOverlay').style.display = 'flex';
            document.getElementById('loadingText').textContent = 'Setting up your personalized dashboard...';
            
            try {
                const response = await fetch('/save_preferences', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        selected_categories: selectedCategories,
                        selected_subcategories: selectedSubcategories
                    })
                });
                
                const data = await response.json();
                console.log('📊 Save response:', data);
                
                if (data.success) {
                    console.log('✅ Preferences saved successfully');
                    document.getElementById('loadingText').textContent = 'Launching your personalized shopping experience...';
                    
                    setTimeout(() => {
                        document.getElementById('loadingOverlay').style.display = 'none';
                        goToDashboard();
                    }, 2000);
                } else {
                    document.getElementById('loadingOverlay').style.display = 'none';
                    console.error('❌ Failed to save preferences:', data.error);
                    alert('Failed to save preferences: ' + data.error);
                }
            } catch (error) {
                document.getElementById('loadingOverlay').style.display = 'none';
                console.error('❌ Error saving preferences:', error);
                alert('An error occurred while saving preferences');
            }
        }

        // Go to dashboard
        function goToDashboard() {
            console.log('🏠 Redirecting to dashboard...');
            window.location.href = '/dashboard';
        }

        // Add interactive animations
        document.addEventListener('DOMContentLoaded', function() {
            // Entrance animations
            setTimeout(() => {
                const cards = document.querySelectorAll('.category-card');
                cards.forEach((card, index) => {
                    card.style.opacity = '0';
                    card.style.transform = 'translateY(20px)';
                    
                    setTimeout(() => {
                        card.style.transition = 'all 0.5s ease';
                        card.style.opacity = '1';
                        card.style.transform = 'translateY(0)';
                    }, index * 100);
                });
            }, 500);

            // Hover effects
            document.addEventListener('mouseover', function(e) {
                if (e.target.closest('.category-card')) {
                    const card = e.target.closest('.category-card');
                    if (!card.classList.contains('selected')) {
                        card.style.transform = 'translateY(-2px) scale(1.02)';
                    }
                }
            });

            document.addEventListener('mouseout', function(e) {
                if (e.target.closest('.category-card')) {
                    const card = e.target.closest('.category-card');
                    if (!card.classList.contains('selected')) {
                        card.style.transform = 'translateY(0) scale(1)';
                    }
                }
            });
        });
    </script>
</body>
</html>
