<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cypress Code to Business Logic Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        input, select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 40px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-area:hover {
            background: #f0f2ff;
            border-color: #764ba2;
        }

        .upload-area.dragover {
            background: #e8ebff;
            border-color: #764ba2;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 4em;
            color: #667eea;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 1.2em;
            color: #555;
            margin-bottom: 10px;
        }

        .upload-hint {
            color: #888;
            font-size: 0.9em;
        }

        .file-list {
            margin-top: 20px;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .file-name {
            font-weight: 500;
            color: #333;
        }

        .file-size {
            color: #888;
            font-size: 0.9em;
            margin-left: 10px;
        }

        .remove-file {
            background: #ff4757;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .remove-file:hover {
            background: #e84118;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            width: 100%;
            margin-top: 20px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .status-message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results-section {
            margin-top: 30px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .download-list {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }

        .download-item {
            background: white;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .download-item:hover {
            transform: translateX(5px);
        }

        .download-item-info {
            flex: 1;
        }

        .source-file {
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .excel-file {
            color: #666;
            font-size: 0.9em;
        }

        .test-count {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            margin-top: 8px;
        }

        .test-count.zero {
            background: #ffa502;
        }

        .download-btn {
            background: #28a745;
            padding: 10px 25px;
            font-size: 0.95em;
            width: auto;
            margin: 0;
            white-space: nowrap;
        }

        .download-btn:hover {
            background: #218838;
        }

        .download-all-btn {
            background: #17a2b8;
            margin-top: 20px;
        }

        .download-all-btn:hover {
            background: #138496;
        }

        #fileInput {
            display: none;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 15px;
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border-radius: 10px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .zip-badge {
            display: inline-block;
            background: #6c5ce7;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Cypress Code Analyzer</h1>
            <p>Convert The Travel Company's Cypress automation code into readable business logic</p>
        </div>

        <div class="content">

            <!-- File Upload Section -->
            <div class="section">
                <h2 class="section-title">📁 Upload Cypress Files</h2>
                <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                    <div class="upload-icon">📤</div>
                    <div class="upload-text">Click to upload or drag & drop</div>
                    <div class="upload-hint">Support for .js, .ts, .jsx, .tsx files or .zip archives</div>
                </div>
                <input type="file" id="fileInput" multiple accept=".js,.ts,.jsx,.tsx,.zip">
                <div class="file-list" id="fileList"></div>
                <button id="convertBtn" onclick="convertFiles()" disabled>Convert to Business Logic</button>
                <div class="loader" id="loader"></div>
                <div id="conversionStatus" class="status-message"></div>
            </div>

            <!-- Results Section -->
            <div class="results-section" id="resultsSection">
                <h3 style="margin-bottom: 10px;">📊 Conversion Results</h3>
                
                <div class="stats-bar" id="statsBar" style="display: none;">
                    <div class="stat-item">
                        <div class="stat-value" id="totalFiles">0</div>
                        <div class="stat-label">Excel Files</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="totalTests">0</div>
                        <div class="stat-label">Test Blocks</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="totalSource">0</div>
                        <div class="stat-label">Source Files</div>
                    </div>
                </div>

                <div class="download-list" id="downloadList"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8001';
        let selectedFiles = [];
        let generatedFiles = [];

        // File upload handling
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const convertBtn = document.getElementById('convertBtn');

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        function handleFiles(files) {
            selectedFiles = Array.from(files).filter(file => 
                file.name.endsWith('.js') || 
                file.name.endsWith('.ts') || 
                file.name.endsWith('.jsx') || 
                file.name.endsWith('.tsx') ||
                file.name.endsWith('.zip')
            );

            displayFiles();
            convertBtn.disabled = selectedFiles.length === 0;
        }

        function displayFiles() {
            fileList.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                const isZip = file.name.endsWith('.zip');
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `
                    <div>
                        <span class="file-name">${isZip ? '📦' : '📄'} ${file.name}</span>
                        ${isZip ? '<span class="zip-badge">ZIP</span>' : ''}
                        <span class="file-size">(${(file.size / 1024).toFixed(2)} KB)</span>
                    </div>
                    <button class="remove-file" onclick="removeFile(${index})">Remove</button>
                `;
                fileList.appendChild(fileItem);
            });
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            displayFiles();
            convertBtn.disabled = selectedFiles.length === 0;
        }

        async function convertFiles() {
            if (selectedFiles.length === 0) return;

            const loader = document.getElementById('loader');
            const statusDiv = document.getElementById('conversionStatus');
            const resultsSection = document.getElementById('resultsSection');
            const downloadList = document.getElementById('downloadList');

            loader.style.display = 'block';
            statusDiv.className = 'status-message info';
            statusDiv.textContent = '⏳ Processing files... This may take a moment.';
            convertBtn.disabled = true;
            resultsSection.style.display = 'none';

            const formData = new FormData();
            selectedFiles.forEach(file => {
                formData.append('files', file);
            });

            try {
                const response = await fetch(`${API_BASE_URL}/api/convert`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    generatedFiles = result.generated_files;
                    
                    statusDiv.className = 'status-message success';
                    statusDiv.innerHTML = `
                        ✅ ${result.message}<br>
                        Generated ${result.total_excel_files} Excel file(s) in ZIP archive<br>
                        <button class="download-btn" onclick="downloadZip('${result.zip_download_url}', '${result.zip_filename}')" style="margin-top: 15px;">
                            📦 Download ZIP (${result.zip_filename})
                        </button>
                    `;

                    // Display download list
                    downloadList.innerHTML = '';
                    let totalTests = 0;
                    
                    generatedFiles.forEach(file => {
                        totalTests += file.test_blocks_found;
                        
                        const downloadItem = document.createElement('div');
                        downloadItem.className = 'download-item';
                        downloadItem.innerHTML = `
                            <div class="download-item-info">
                                <div class="source-file">📄 ${file.source_file}</div>
                                <div class="excel-file">➜ ${file.excel_file}</div>
                                <span class="test-count ${file.test_blocks_found === 0 ? 'zero' : ''}">
                                    ${file.test_blocks_found === 0 ? '⚠️ No tests found' : `✓ ${file.test_blocks_found} test block(s)`}
                                </span>
                                ${file.error ? `<div style="color: #ff4757; margin-top: 5px; font-size: 0.85em;">⚠️ ${file.error}</div>` : ''}
                            </div>
                        `;
                        downloadList.appendChild(downloadItem);
                    });

                    // Update stats
                    document.getElementById('totalFiles').textContent = result.total_excel_files;
                    document.getElementById('totalTests').textContent = totalTests;
                    document.getElementById('totalSource').textContent = generatedFiles.length;
                    document.getElementById('statsBar').style.display = 'flex';

                    resultsSection.style.display = 'block';
                } else {
                    statusDiv.className = 'status-message error';
                    statusDiv.textContent = '❌ ' + (result.detail || 'Conversion failed');
                }
            } catch (error) {
                statusDiv.className = 'status-message error';
                statusDiv.textContent = '❌ Error: ' + error.message;
            } finally {
                loader.style.display = 'none';
                convertBtn.disabled = false;
            }
        }

        function downloadExcel(url) {
            window.open(API_BASE_URL + url, '_blank');
        }

        function downloadZip(url, filename) {
            const link = document.createElement('a');
            link.href = API_BASE_URL + url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function downloadAll() {
            // This function is no longer needed as we download a single ZIP
            generatedFiles.forEach((file, index) => {
                setTimeout(() => {
                    downloadExcel(file.download_url);
                }, index * 500);
            });
        }

        // Check server health on load
        async function checkHealth() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/health`);
                if (response.ok) {
                    console.log('✓ Server is healthy');
                }
            } catch (error) {
                console.error('✗ Server connection failed:', error);
                const statusDiv = document.getElementById('conversionStatus');
                statusDiv.className = 'status-message error';
                statusDiv.textContent = '❌ Cannot connect to server. Please ensure the backend is running on port 8001.';
            }
        }

        checkHealth();
    </script>
</body>
</html>
